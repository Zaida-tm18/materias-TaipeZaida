<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${esEdicion} ? 'Editar materia' : 'Nueva materia'"></title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main class="form-box">
    <h1 th:text="${esEdicion} ? 'Editar materia' : 'Nueva materia'"></h1>

    <!-- th:action resuelve a POST /materias (crear) o POST /materias/{id} (editar);
         el token CSRF se inyecta automaticamente en ambos casos -->
    <form th:action="${esEdicion} ? @{/materias/{id}(id=${materia.id})} : @{/materias}"
          th:object="${materia}" method="post" novalidate>

        <label for="codigo">Codigo (6 caracteres)</label>
        <input type="text" id="codigo" th:field="*{codigo}" required minlength="6" maxlength="6" pattern=".{6}">
        <p class="field-error" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></p>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}" required minlength="5" maxlength="80">
        <p class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>

        <label for="creditos">Creditos (1-6)</label>
        <input type="number" id="creditos" th:field="*{creditos}" required min="1" max="6">
        <p class="field-error" th:if="${#fields.hasErrors('creditos')}" th:errors="*{creditos}"></p>

        <label for="semestre">Semestre (1-10)</label>
        <input type="number" id="semestre" th:field="*{semestre}" required min="1" max="10">
        <p class="field-error" th:if="${#fields.hasErrors('semestre')}" th:errors="*{semestre}"></p>

        <div class="actions">
            <button type="submit" class="btn">Guardar</button>
            <a th:href="@{/materias}" class="btn secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
