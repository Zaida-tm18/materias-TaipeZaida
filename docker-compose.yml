services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-materias_db}
      POSTGRES_USER: ${DB_USER:-materias_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-materias_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-materias_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-materias_db}
      DB_USER: ${DB_USER:-materias_user}
      DB_PASSWORD: ${DB_PASSWORD:-materias_pass}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db_data:
